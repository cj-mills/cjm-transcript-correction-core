name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The workflow lane's suite runs in the lane's env: a writer on the shared workflow journal
      # needs every core's replay registry (ruling 6683f49e (2)), so the sibling cores install too.
      - run: pip install -e .[test] cjm-transcript-decomp-core cjm-transcription-core
      - run: pytest tests/
